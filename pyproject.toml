[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "chemlab"
version = "0.1.0"
description = "Evidence-bound retrosynthesis planning and independent route verification"
requires-python = ">=3.11"
dependencies = [
  "rdkit", "rdchiral", "syntheseus", "pydantic>=2", "fastapi", "uvicorn"
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy", "hypothesis"]
pretrained = ["retrochimera==1.3.0", "torch==2.14.1", "pytorch-lightning==2.6.6"]

[project.scripts]
chemlab = "chemlab.cli:main"

[tool.setuptools.packages.find]
include = ["chemlab*"]

[tool.setuptools.package-data]
chemlab = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
